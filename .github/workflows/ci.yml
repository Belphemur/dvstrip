name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1

  integration:
    # Build-tagged end-to-end tests against the real toolchain. The portable
    # jellyfin-ffmpeg tarball provides hevc_metadata=remove_dovi, which stock
    # ubuntu ffmpeg lacks.
    runs-on: ubuntu-latest
    env:
      JELLYFIN_FFMPEG: 7.1.4-3 # pinned for reproducibility; bump deliberately
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install jellyfin-ffmpeg (portable)
        run: |
          curl -fsSL "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JELLYFIN_FFMPEG}/jellyfin-ffmpeg_${JELLYFIN_FFMPEG}_portable_linux64-gpl.tar.xz" -o /tmp/jff.tar.xz
          mkdir -p "$HOME/jellyfin-ffmpeg"
          tar -xJf /tmp/jff.tar.xz -C "$HOME/jellyfin-ffmpeg"
          echo "$HOME/jellyfin-ffmpeg" >> "$GITHUB_PATH"
      - name: Verify toolchain supports remove_dovi
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -h bsf=hevc_metadata | grep -q remove_dovi
      - run: go test -tags integration ./internal/convert/ -v -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # pinned for reproducibility; bump deliberately

  goreleaser-snapshot:
    # Validates .goreleaser.yaml end-to-end (builds binaries + both docker
    # platforms) on every PR, without pushing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  gate:
    # Single aggregated check: make this the only required status check in
    # branch protection. if: always() + explicit result check, because a
    # *skipped* required check counts as passed in branch protection.
    name: gate
    runs-on: ubuntu-latest
    needs: [test, lint, integration, goreleaser-snapshot]
    if: always()
    steps:
      - name: All jobs must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success")' > /dev/null
