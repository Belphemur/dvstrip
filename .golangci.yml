version: "2"

run:
  timeout: 5m

lint:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - goconst
    - gofumpt
  disable:
    - lll
    - wsl

issues:
  exclude-rules:
    - path: internal/probe/fixture_test.go
      linters: [goconst]
