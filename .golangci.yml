version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - goconst
  exclusions:
    rules:
      - linters: [goconst]
        path: internal/probe/fixture_test.go

formatters:
  enable:
    - gofumpt
