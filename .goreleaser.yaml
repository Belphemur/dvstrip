version: 2
project_name: dvstrip

before:
  hooks:
    - go mod tidy

builds:
  - id: dvstrip
    main: .
    binary: dvstrip
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: [-s, -w]

# Linux executables are published on the GitHub Release alongside the
# multi-arch docker images + manifest.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  disable: false

dockers_v2:
  - id: dvstrip
    dockerfile: Dockerfile
    ids: [dvstrip]
    images:
      - ghcr.io/belphemur/dvstrip
    tags:
      - "v{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: dvstrip
      org.opencontainers.image.description: "Strip Dolby Vision to HDR10 without re-encoding"
      org.opencontainers.image.source: https://github.com/Belphemur/dvstrip

changelog:
  use: github
